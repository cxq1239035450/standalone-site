server {
    listen 80;
    server_name 38.76.170.123;
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Public immutable snapshots only. Keep this directory aligned with MEDIA_CACHE_DIR.
    # Error responses deliberately do not receive immutable cache headers.
    location ~ "^/assets/media/([a-f0-9]{64}\.(?:jpg|png|webp|avif|gif|mp4|webm|ogv))$" {
        alias /opt/standalone-site/shared/media/.immutable/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        etag on;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
